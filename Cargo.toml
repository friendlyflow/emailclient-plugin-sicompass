# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "emailclient-plugin"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "IMAP and SMTP email for sicompass: folders, messages and a compose form as lists, as a plugin"
repository = "https://github.com/friendlyflow/emailclient-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The client is the library, which
# the unit tests use.
[[bin]]
name = "emailclient-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All email I/O runs on one tokio runtime (`connection::runtime`), off the
# app's calls. IMAP is async-imap, over the stream `connection.rs` opens (a
# tokio TCP socket and tokio-rustls).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# TLS for IMAP. ring is the crypto (aws-lc-rs would need cmake and a musl C
# toolchain for the static Linux build), with the webpki roots bundled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# SMTP: lettre's async transport on the same runtime, with rustls (ring) and
# the webpki roots. STARTTLS for smtp://, implicit TLS for smtps://.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
base64 = "0.22"
quoted_printable = "0.5"
# The envelope cache. Bundled: SQLite is compiled from its C source into the
# executable, so no platform needs a system library and the musl build stays
# static.
rusqlite = { version = "0.40", features = ["bundled"] }

# The HTTP to Google's OAuth endpoints. rustls (ring) with bundled roots, so
# the static musl build needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
