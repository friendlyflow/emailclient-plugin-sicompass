# Its own workspace root: a plugin, only ever built for wasm32-wasip2 (and
# natively for its unit tests).
[workspace]

[package]
name = "emailclient-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "IMAP and SMTP email for sicompass: folders, messages and a compose form as lists, as a WASM plugin"
repository = "https://github.com/friendlyflow/emailclient_plugin_sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest kit and the FFON model. By git until sicompass-sdk 0.9 and
# sicompass-pdk 0.6 are on crates.io; the pdk uses the SDK from the same rev.
sicompass-pdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "494cff619feb408aff15f541ba530120a65019fa" }
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "494cff619feb408aff15f541ba530120a65019fa", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IMAP, blocking, over the stream `connection.rs` opens (a host socket and
# rustls in the sandbox). imap-proto for the response types it hands back.
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
# TLS in the guest. ring is the crypto, and it builds for wasm32 with clang.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# Building messages. SMTP itself is a few commands over `connection::open_tls`.
lettre = { version = "0.11", default-features = false, features = ["builder"] }
base64 = "0.22"
quoted_printable = "0.5"

# HTTP natively, for the tests. Inside the sandbox every request goes through
# the host's `net.fetch`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Guests ship as bytecode, and App Store builds interpret rather than JIT them, so
# a small module matters more than aggressive inlining.
opt-level = "s"
lto = true
strip = true

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the pinned rev resolves to.
#
# [patch."https://github.com/friendlyflow/sicompass-plugin-sdk"]
# sicompass-pdk = { path = "../sicompass-plugin-sdk/sicompass-pdk" }
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
